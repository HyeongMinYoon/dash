<body>
<title>무한매수 관제판</title>
<meta name="theme-color" content="#0A0C0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="관제판">
<style>
/* ── 무한매수 관제판 (2026-10-03 재구성: 무한매수 전용, 탭 없음, 회차 칸 레이아웃)
   터미널 스킨 다크 토큰(2026-08-01 판) 고정 — 사용자 요청으로 시스템 설정과 무관하게 항상 다크. */
:root{
  color-scheme:dark;
  --bg:#0A0C0F; --card:#101419; --ink:#E4E8EE; --muted:#78838F; --ok:#3DA57F;
  --up:#F5564E; --dn:#4E90F5; --acc:#F0A62A; --line:#1D242D; --chip:#171D25;
  --mono:"Cascadia Mono","SF Mono",ui-monospace,Consolas,monospace;
  --rad:4px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;padding:14px 12px 44px;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  padding:6px 2px 8px;border-bottom:1px solid var(--line)}
h1{font-size:16px;font-weight:700;margin:0;letter-spacing:.02em}
.stamp{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.live{display:inline-block;width:6px;height:6px;background:var(--acc);margin-right:7px;
  vertical-align:2px;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.live{animation:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:13px 14px}
.warn{border-color:var(--up);border-left-width:3px;color:var(--up);font-size:12.5px;
  padding:9px 12px;font-weight:600}
h2{font-size:11px;font-weight:700;margin:0 0 11px;letter-spacing:.09em;font-family:var(--mono);
  padding-bottom:7px;border-bottom:1px solid var(--line)}
h2::before{content:"";display:inline-block;width:3px;height:10px;background:var(--acc);
  margin-right:7px;vertical-align:-1px}
.grid4{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.stat .l{font-size:10px;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
.stat .v{font-size:19px;font-weight:700;font-family:var(--mono);letter-spacing:-.01em;margin-top:1px}
.up{color:var(--up)} .dn{color:var(--dn)} .mut{color:var(--muted)}
.ib{padding:11px 0;border-top:1px solid var(--line)}
.ib:first-child{border-top:none;padding-top:2px}
.ib .t1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;
  margin-bottom:6px;font-family:var(--mono);font-size:12px}
.ib .t1 b{font-family:"Pretendard Variable",Pretendard,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:14px;font-weight:700;margin-right:6px}
.cells{display:flex;gap:6px}
.half{flex:1;display:grid;gap:1px}
.half i{height:15px;border-radius:1px;background:var(--chip)}
.half i.on{background:var(--acc)}
.half i.part{background:color-mix(in srgb,var(--acc) 45%,var(--chip))}
.ib .t2{display:flex;align-items:center;gap:3px;margin-top:7px;font-size:11px;
  color:var(--muted);font-family:var(--mono);flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.none{background:transparent;border:1px solid var(--line)}
.ib .t2 em{font-style:normal;margin-left:6px}
@media (max-width:480px){
  .wrap{padding:10px 9px 34px} .card{padding:11px 12px}
  .stat .v{font-size:16px} h1{font-size:15px}
  .cells{gap:4px} .half i{height:13px}
}

#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:var(--bg);padding:24px}
#lock .box{width:100%;max-width:330px;display:flex;flex-direction:column;gap:13px}
#lock .ttl{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--acc)}
#lock .ttl b{display:block;color:var(--ink);font-size:17px;letter-spacing:.02em;margin-top:5px;
  text-transform:none;font-weight:700}
#lock input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:4px;
  color:var(--ink);font-family:var(--mono);font-size:16px;padding:12px 13px;letter-spacing:.05em}
#lock input:focus{outline:none;border-color:var(--acc)}
#lock button{background:var(--acc);color:#0A0C0F;border:none;border-radius:4px;font-weight:700;
  font-family:var(--mono);font-size:13px;letter-spacing:.08em;padding:13px;cursor:pointer;
  min-height:48px}
#lock button:disabled{opacity:.5;cursor:default}
#lock .msg{font-family:var(--mono);font-size:11px;color:var(--muted);min-height:15px;line-height:1.5}
#lock .msg.err{color:var(--up)}
</style>
<div id="lock"><form class="box" id="lockform">
  <div class="ttl">Locked<b>무한매수 관제판</b></div>
  <input id="pw" type="password" inputmode="text" autocomplete="current-password"
         placeholder="암호" aria-label="암호" autofocus>
  <button type="submit" id="unlock">열기</button>
  <div class="msg" id="lockmsg">이 기기에서만 복호화됩니다 · 암호는 전송되지 않습니다</div>
</form></div>
<div class="wrap">
<header><h1><span class="live"></span>무한매수 관제판</h1><span class="stamp" id="stamp"></span></header>
<div id="warnbox"></div>
<section class="card"><h2>요약</h2><div class="grid4" id="sum"></div></section>
<section class="card"><div id="ibbox"></div></section>
</div>

window.__render = function(__t){
const D = JSON.parse(__t);

const invSum = IB.reduce((a,d) => a + inv(d), 0);
const cash = (D.totals||{}).cash_usd || 0;
const perDay = IB.reduce((a,d) => a + (d.splits ? d.seed / d.splits : 0), 0);
const days = perDay > 0 ? cash / perDay : 0;
$('sum').innerHTML = [
  ['투입 중', fD(invSum)], ['달러 현금', fD(cash)], ['실탄', Math.floor(days) + '일']
].map(x => '<div class="stat"><div class="l">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>').join('');

function half(from, to, T) {
  let h = '';
  for (let i = from; i < to; i++)
    h += '<i class="' + (i + 1 <= T ? 'on' : (i < T ? 'part' : '')) + '"></i>';
  return '<div class="half" style="grid-template-columns:repeat(' + (to - from) + ',minmax(0,1fr))">' + h + '</div>';
}
$('ibbox').innerHTML = IB.map(d => {
  const N = d.splits || 40, m = Math.floor(N / 2), T = Math.min(d.T, N);
  const ret = d.qty > 0
    ? '<span class="' + (d.cur_ret >= 0 ? 'up' : 'dn') + '">' + (d.cur_ret > 0 ? '+' : '') + d.cur_ret.toFixed(1) + '%</span>'
    : '<span class="mut">첫 매수 대기</span>';
  const dots = d.cycle > 0
    ? Array.from({length: d.cycle}, () => '<i class="dot"></i>').join('')
    : '<i class="dot none"></i>';
  return '<div class="ib"><div class="t1"><span><b>' + d.sym + '</b><span class="mut">' + d.T.toFixed(1) + '/' + N + '</span></span>'
    + '<span>' + fD(inv(d)) + ' <span class="mut">/ ' + fD(d.seed) + '</span> · ' + ret + '</span></div>'
    + '<div class="cells">' + half(0, m, T) + half(m, N, T) + '</div>'
    + '<div class="t2">' + dots + '<em>목표 +' + (d.target_eff != null ? d.target_eff : d.target_pct) + '%' + (d.qty > 0 && d.target_eff_px ? ' ($' + d.target_eff_px.toFixed(2) + ')' : '') + ' · 사이클 ' + d.cycle + '회 · 실현 ' + fD(d.banked) + '</em></div></div>';
}).join('');
};

// ── 잠금 해제: PBKDF2 로 키를 만들고 AES-GCM 복호화. 성공해야 렌더링이 시작된다.
(function(){
  const enc = JSON.parse(document.getElementById('encdata').textContent);
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const msg = document.getElementById('lockmsg');
  const btn = document.getElementById('unlock');
  const REMEMBER = 'dash.key';           // 성공한 암호를 이 기기에만 저장(선택)

  async function tryPass(pw, quiet){
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
                 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:b(enc.salt), iterations:enc.iter, hash:'SHA-256'},
      km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b(enc.iv)}, key, b(enc.ct));
    return new TextDecoder().decode(buf);
  }

  function boot(text, pw){
    try { localStorage.setItem(REMEMBER, pw); } catch(e){}
    document.getElementById('lock').remove();
    window.__render(text);
  }

  document.getElementById('lockform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    if (!pw) return;
    btn.disabled = true; msg.className='msg'; msg.textContent = '복호화 중…';
    try { boot(await tryPass(pw), pw); }
    catch (err) {
      msg.className = 'msg err';
      msg.textContent = '암호가 맞지 않습니다. 다시 입력해 주세요.';
      btn.disabled = false;
      document.getElementById('pw').select();
    }
  });

  // 이전에 성공한 암호가 이 기기에 있으면 자동 해제(앱처럼 바로 열리게)
  (async () => {
    let saved = null;
    try { saved = localStorage.getItem(REMEMBER); } catch(e){}
    if (!saved) return;
    try { boot(await tryPass(saved), saved); }
    catch (e) { try { localStorage.removeItem(REMEMBER); } catch(_){} }
  })();
})();

</script>
